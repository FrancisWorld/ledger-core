# Local stack: PostgreSQL plus the service built from this repository.
#   cp .env.example .env && docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:?copy .env.example to .env first}
    ports:
      - "127.0.0.1:${LEDGER_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  ledger:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?copy .env.example to .env first}
    ports:
      - "127.0.0.1:${LEDGER_HTTP_PORT:-8080}:8080"
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
