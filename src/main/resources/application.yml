spring:
  application:
    name: ledger-core
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:replace-me}
    hikari:
      maximum-pool-size: ${LEDGER_DB_POOL_SIZE:20}
      connection-timeout: 5000
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s

server:
  port: ${LEDGER_HTTP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ledger-core

springdoc:
  swagger-ui:
    path: /swagger-ui

ledger:
  outbox:
    sink: ${LEDGER_OUTBOX_SINK:LOG}
    sqs:
      queue-url: ${LEDGER_OUTBOX_SQS_QUEUE_URL:}
      region: ${LEDGER_OUTBOX_SQS_REGION:}
      endpoint: ${LEDGER_OUTBOX_SQS_ENDPOINT:}
